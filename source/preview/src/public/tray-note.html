<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font: 13px -apple-system, BlinkMacSystemFont, sans-serif; }
    body { padding: 14px; border: 1px solid #779d98; border-radius: 10px; color: #f5faf8; background: #172522; }
    .windows { opacity: .4; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .speed { font-size: 15px; font-weight: 650; }
    .network, .note { color: #d4e3dd; font-size: 11px; margin-top: 4px; }
    .models { border-top: 1px solid #63766f; margin-top: 10px; padding-top: 7px; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin: 5px 0; }
    .row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <h1>本机 Codex 用量</h1>
  <div id="speed" class="speed">等待本机模型记录</div>
  <div id="network" class="network">整机下载速度：—</div>
  <div class="models" id="models"></div>
  <div class="note" id="speed-note">模型速度为近期请求估算 · 用量按当前选择的周期显示</div>
  <script>
    if (/Windows/i.test(navigator.userAgent)) document.body.classList.add('windows');
    window.renderCodexData = function (data) {
      const speed = data.view?.speed || {};
      document.getElementById('speed').textContent = (speed.model || '等待模型记录') + '：' +
        (speed.rate == null ? '—' : Number(speed.rate).toFixed(2)) + ' tok/s';
      document.getElementById('speed-note').textContent = (speed.state === 'idle' ? '当前没有运行中的会话' : speed.state === 'unknown' ? '当前会话状态未知' : '模型速度为近期请求估算') + ' · 用量按当前选择的周期显示';
      document.getElementById('network').textContent = '整机下载速度：' + (data.downloadText || '—');
      const list = document.getElementById('models');
      list.replaceChildren();
      const rows = [...(data.view?.displayModels || [])].sort((a, b) => Date.parse(b.lastAt || 0) - Date.parse(a.lastAt || 0)).slice(0, 3);
      if (!rows.length) { list.textContent = '当前周期暂无模型用量'; return; }
      for (const row of rows) {
        const line = document.createElement('div'); line.className = 'row';
        const name = document.createElement('span'); name.textContent = row.name;
        const amount = document.createElement('span');
        amount.textContent = new Intl.NumberFormat('zh-CN').format(row.tokens) + ' Token · ' +
          (row.usd == null ? '—' : '≈$' + Number(row.usd).toFixed(2)) +
          (row.unpriced ? ' · ' + row.unpriced + ' 条未计价' : '');
        line.append(name, amount); list.append(line);
      }
    };
  </script>
</body>
</html>
